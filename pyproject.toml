[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-ics-distillation"
version = "0.1.0"
description = "Training and export utilities for symbolic distillation on ICS time series."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "omegaconf>=2.3",
  "scikit-learn>=1.3",
  "sympy>=1.12",
  "networkx>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
plot = [
  "matplotlib>=3.8",
]
distill = [
  "pysr>=0.19",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
